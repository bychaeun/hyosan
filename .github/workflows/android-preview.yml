name: Build Android TWA APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-preview.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release for local signing
        run: |
          gradle -p android --no-daemon :app:assembleRelease :app:lintRelease
          mkdir -p android-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-output/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-output/
      - uses: actions/upload-artifact@v4
        with:
          name: HYOSAN-LPL-TWA-unsigned
          path: android-output/
          if-no-files-found: error
          retention-days: 30
