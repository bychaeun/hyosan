<style>
:root{--bg:#f4f2ed;--panel:#fff;--ink:#151515;--muted:#777;--line:#ded9cf;--dark:#151515}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink)}button,input{font-family:inherit}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#151515;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-size:15pt;font-weight:700;line-height:1.15;margin-bottom:24px}.brand small{display:block;font-size:8pt;color:#999;font-weight:400;margin-top:8px}.nav button{display:block;width:100%;border:0;background:transparent;color:#ccc;text-align:left;padding:11px 10px;border-radius:9px;font-size:11pt;cursor:pointer}.nav button.active,.nav button:hover{background:#fff;color:#111}main{padding:26px;min-width:0}h1{font-size:15pt;margin:0 0 6px}h2,.label{font-size:11pt}p,.tag,.value,.chip,.status,input,button{font-size:8pt}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.status{color:var(--muted)}.status.ok{color:#23652e}.status.err{color:#a11}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{min-width:220px;padding:9px 10px;border:1px solid var(--line);border-radius:9px}.btn{border:1px solid #222;background:#222;color:#fff;padding:8px 11px;border-radius:9px;cursor:pointer}.btn.ghost{background:#fff;color:#222;border-color:var(--line)}.page{display:none}.page.active{display:block}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 16px}.tabs button{border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:999px;cursor:pointer}.tabs button.active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.07)}.card img{width:100%;height:132px;object-fit:cover;display:block;background:#ddd}.card .body{padding:10px}.card .tag{color:#777}.pager{display:flex;justify-content:center;gap:6px;margin:18px 0}.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px}.pager button.active{background:#111;color:#fff}.color-layout{display:grid;grid-template-columns:360px 1fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.wheel-wrap{position:relative;width:300px;height:300px;margin:auto}.wheel-wrap canvas{width:300px;height:300px;border-radius:50%;cursor:crosshair}.picker{position:absolute;width:14px;height:14px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #111;pointer-events:none;transform:translate(-7px,-7px)}.slider-row{display:grid;grid-template-columns:50px 1fr 34px;gap:8px;align-items:center;margin:10px 0}.selected{display:grid;grid-template-columns:68px 1fr;gap:10px;align-items:center;margin-top:14px}.swatch{height:62px;border-radius:10px;border:1px solid var(--line)}dialog{border:0;border-radius:18px;padding:0;max-width:980px;width:86vw;box-shadow:0 30px 80px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(0,0,0,.4)}.modal{display:grid;grid-template-columns:48% 52%;max-height:86vh;background:#fff;overflow:hidden}.img-wrap{overflow:hidden;background:#e9e4db}.img-wrap img{width:100%;height:100%;min-height:470px;object-fit:cover;transition:.16s;transform-origin:center}.img-wrap:hover img{transform:scale(1.5)}.modal-body{padding:22px;overflow:auto}.modal-head{display:flex;justify-content:space-between;gap:8px}.close{width:30px;height:30px;border:0;border-radius:50%;background:#111;color:#fff;cursor:pointer;font-size:11pt}.meta{border-top:1px solid var(--line);padding-top:9px;margin-top:12px}.label{font-weight:700;margin-bottom:5px}.value{line-height:1.65}.chip{border:1px solid var(--line);background:#fafafa;border-radius:999px;padding:6px 8px;cursor:pointer;margin:2px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.muted{color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:relative;height:auto}.top{display:block}.color-layout,.modal{grid-template-columns:1fr}.wheel-wrap,.wheel-wrap canvas{width:260px;height:260px}}
#patternGrid .card{display:flex;align-items:center}#patternGrid .card img{width:84px;height:84px;flex-shrink:0}#patternGrid .card h2{margin:0 0 6px}.card:focus-visible{outline:3px solid #876e47}.pager{flex-wrap:wrap}@media(max-width:900px){dialog{max-height:90vh;overflow:auto}.modal{max-height:none;overflow:visible}.img-wrap img{min-height:0;height:240px}.modal-body{overflow:visible}.top input{min-width:0;width:100%}}
.related-scroll{max-height:180px;overflow-y:auto;overscroll-behavior:contain;padding-right:8px;overflow-wrap:anywhere}.related-scroll .chip{max-width:100%;white-space:normal;text-align:left}.actions .btn:disabled{opacity:.55;cursor:wait}#actionStatus{overflow-wrap:anywhere}#printArea{display:none}

<body>
<div class="app"><aside><div class="brand">HYOSAN<br>LPM Library<small>LIVE · Google Sheets Sync</small></div><div class="nav"><button class="active" data-page="patterns">패턴 디자인</button><button data-page="lpm">효산 LPM 디자인</button><button data-page="emboss">경면판</button><button data-page="colorist">컬러리스트</button></div></aside>
<main><div class="top"><div><h1 id="pageTitle">패턴 디자인</h1><div id="syncStatus" class="status">데이터 연결 대기</div></div><div class="tools"><input id="search" placeholder="이름 / 분류 / 품번 검색"><button class="btn ghost" id="reload">지금 동기화</button><button class="btn ghost" onclick="printCatalog()">PDF 저장</button></div></div>
<section id="patterns" class="page active"><div class="tabs" id="patternTabs"></div><div class="grid" id="patternGrid"></div><div class="pager" id="patternPager"></div></section>
<section id="lpm" class="page"><div class="tabs" id="lpmTabs"></div><div class="grid" id="lpmGrid"></div><div class="pager" id="lpmPager"></div></section>
<section id="emboss" class="page"><div class="grid" id="embossGrid"></div></section>
<section id="colorist" class="page"><div class="color-layout"><div class="panel"><h2>색상환</h2><div class="wheel-wrap"><canvas id="wheel" width="300" height="300"></canvas><div id="picker" class="picker"></div></div><div class="slider-row"><span>채도</span><input id="sat" type="range" min="0" max="100" value="70"><span id="satV">70</span></div><div class="slider-row"><span>명도</span><input id="light" type="range" min="0" max="100" value="70"><span id="lightV">70</span></div><div class="selected"><div id="swatch" class="swatch"></div><div><h2 id="hex">#C7A97B</h2><div class="muted">선택색 기준 유사도 30% 범위</div></div></div></div><div class="panel"><h2>추천 효산 LPM</h2><p id="colorHelp" class="muted">색상환을 클릭하세요.</p><div id="colorGrid" class="grid"></div></div></div></section>
</main></div>

<script>
const CONFIG={API_URL:'https://script.google.com/macros/s/AKfycbz2_7sYLn86R2WomTWsgeydGw9vy99f3EuF7RGVnt-wE_Y1yH_hUtjtgAwEFezXkkAu/exec',SYNC_MS:15000,ITEMS_PER_PAGE:30,COLOR_TOLERANCE_PERCENT:30};
let db={patterns:[],lpm:[],emboss:[],categories:[],config:{}},state={patternCat:'ALL',lpmCat:'ALL',pPage:1,lPage:1,selectedHex:'#C7A97B'};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],split=v=>String(v||'').split(',').map(x=>x.trim()).filter(Boolean),safeImg=u=>esc(/^https?:\/\//i.test(String(u))?u:'https://placehold.co/800x600/e7e2d9/555?text=No+Image');
function setStatus(t,kind=''){const e=$('#syncStatus');e.textContent=t;e.className='status '+kind}
async function syncData(){if(!CONFIG.API_URL){setStatus('Apps Script URL 설정 필요','err');return}try{setStatus('Google Sheets 동기화 중…');const r=await fetch(CONFIG.API_URL+'?action=data&ts='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j.ok===false||!['patterns','lpm','emboss','categories'].every(k=>Array.isArray(j[k])))throw new Error(j.error||'잘못된 데이터 응답');db=j;setStatus('최신 Google Sheets 반영 · '+new Date().toLocaleTimeString(),'ok');renderAll()}catch(e){setStatus('동기화 실패 · '+e.message,'err')}}
function searchOK(x){const q=$('#search').value.trim().toLowerCase();return !q||JSON.stringify(x).toLowerCase().includes(q)}
function tabs(el,items,active,cb){el.innerHTML='';items.forEach(x=>{const b=document.createElement('button');b.textContent=x.label;b.className=x.code===active?'active':'';b.onclick=()=>cb(x.code);el.appendChild(b)})}
function cats(menu,fallback){const rows=(db.categories||[]).filter(x=>x.Menu===menu);return rows.length?rows.map(x=>({code:x.Code,label:x.Label})):fallback}
function card(item,type){const d=document.createElement('div');d.className='card';let title='',sub='',image='';if(type==='pattern'){title=item.PatternName_KR||item.PatternName_EN;sub=item.SubCategory;image=item.PreviewImageURL||item.MainImageURL}else if(type==='lpm'){title=item.ProductName;sub=(item.ProductCode||'')+' · '+(item.Category||'');image=item.PreviewImageURL||item.ImageURL}else{title=item.PlateName;sub=(item.Company||'')+' · '+(item.Type||'');image=item.ImageURL}d.innerHTML=`<img src="${safeImg(image)}"><div class="body"><h2>${esc(title||'-')}</h2><div class="tag">${esc(sub||'')}</div></div>`;d.tabIndex=0;d.setAttribute('role','button');d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();d.click()}};d.onclick=()=>type==='pattern'?openPattern(item):type==='lpm'?openLpm(item):openEmboss(item);return d}
function pageRows(list,p){const max=Math.max(1,Math.ceil(list.length/CONFIG.ITEMS_PER_PAGE));p=Math.max(1,Math.min(p,max));return {rows:list.slice((p-1)*CONFIG.ITEMS_PER_PAGE,p*CONFIG.ITEMS_PER_PAGE),p,max}}
function pager(el,p,max,cb){el.innerHTML='';if(max<=1)return;['‹',...Array.from({length:max},(_,i)=>i+1),'›'].forEach(v=>{const b=document.createElement('button');b.textContent=v;if(v===p)b.className='active';b.onclick=()=>cb(v==='‹'?Math.max(1,p-1):v==='›'?Math.min(max,p+1):v);el.appendChild(b)})}
function renderPatterns(){const cs=cats('PATTERN',[{code:'ALL',label:'전체'},{code:'WOOD',label:'우드'},{code:'MARBLE',label:'대리석'},{code:'STONE',label:'스톤'},{code:'FABRIC',label:'섬유 / 패브릭'},{code:'TILE',label:'타일 / 세라믹'},{code:'CONCRETE',label:'콘크리트 / 미네랄'},{code:'METAL',label:'메탈'},{code:'NATURAL',label:'내추럴 / 오가닉'},{code:'SOLID',label:'솔리드 / 그래픽'}]);tabs($('#patternTabs'),cs,state.patternCat,c=>{state.patternCat=c;state.pPage=1;renderPatterns()});let list=db.patterns.filter(x=>(state.patternCat==='ALL'||x.PrimaryCategory===state.patternCat)&&searchOK(x));const p=pageRows(list,state.pPage);$('#patternGrid').innerHTML='';p.rows.forEach(x=>$('#patternGrid').appendChild(card(x,'pattern')));pager($('#patternPager'),p.p,p.max,n=>{state.pPage=n;renderPatterns()})}
function renderLpm(){const cs=cats('LPM',[{code:'ALL',label:'전체'},{code:'SOLID',label:'솔리드'},{code:'WOOD',label:'우드'},{code:'STONE',label:'스톤'},{code:'FABRIC',label:'패브릭'}]);tabs($('#lpmTabs'),cs,state.lpmCat,c=>{state.lpmCat=c;state.lPage=1;renderLpm()});let list=db.lpm.filter(x=>(state.lpmCat==='ALL'||x.Category===state.lpmCat)&&searchOK(x)&&String(x.Active).toLowerCase()!=='false');const p=pageRows(list,state.lPage);$('#lpmGrid').innerHTML='';p.rows.forEach(x=>$('#lpmGrid').appendChild(card(x,'lpm')));pager($('#lpmPager'),p.p,p.max,n=>{state.lPage=n;renderLpm()})}
function renderEmboss(){$('#embossGrid').innerHTML='';db.emboss.filter(searchOK).forEach(x=>$('#embossGrid').appendChild(card(x,'emboss')))}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function info(label,v){return `<div class="meta"><div class="label">${label}</div><div class="value ${label.includes('LPM')?'related-scroll':''}">${v||'-'}</div></div>`}
function showModal(title,image,html,actions=''){state.modalImage={url:image,name:title};const m=$('#modal');$('#modalContent').innerHTML=`<div class="modal"><div class="img-wrap"><img src="${safeImg(image)}" id="zoomImg"></div><div class="modal-body"><div class="modal-head"><h1>${esc(title)}</h1><button class="close" onclick="modal.close()">×</button></div>${html}${actions}<p id="actionStatus" role="status" class="muted"></p></div></div>`;const wrap=$('.img-wrap');const img=$('#zoomImg');wrap.onmousemove=e=>{const r=wrap.getBoundingClientRect();img.style.transformOrigin=((e.clientX-r.left)/r.width*100)+'% '+((e.clientY-r.top)/r.height*100)+'%'};if(!m.open)m.showModal()}
function openPattern(p){const l=split(p.RelatedLPM_IDs).map(id=>db.lpm.find(x=>x.LPM_ID===id)).filter(Boolean),ep=split(p.RecommendedEmbossPlate_IDs).map(id=>db.emboss.find(x=>x.EmbossPlate_ID===id)).filter(Boolean);showModal(p.PatternName_KR||p.PatternName_EN,p.MainImageURL,info('학명 / Material Name',esc(p.ScientificName_MaterialName))+info('분류',`${esc(p.PrimaryCategory||'')} / ${esc(p.SubCategory||'')}<br>${esc(p.Classification||'')}`)+info('특징',esc(p.Characteristics))+info('형태',esc(p.PatternForm))+info('용도',esc(p.Applications))+info('경면판 추천',ep.map(x=>`<button class="chip" onclick="openEmbossById(decodeURIComponent('${encodeURIComponent(x.EmbossPlate_ID).replaceAll("'","%27")}'))">${esc(x.PlateName)}</button>`).join(' '))+info('비슷한 효산 LPM',l.map(x=>`<button class="chip" onclick="openLpmById(decodeURIComponent('${encodeURIComponent(x.LPM_ID).replaceAll("'","%27")}'))">${esc(x.ProductName)}</button>`).join(' ')))}
function openLpm(x){const ep=split(x.EmbossPlate_IDs).map(id=>db.emboss.find(v=>v.EmbossPlate_ID===id)).filter(Boolean),ps=split(x.RelatedPattern_IDs).map(id=>db.patterns.find(v=>v.ID===id)).filter(Boolean);const actions=`<div class="actions"><button class="btn" onclick="exportSlide(decodeURIComponent('${encodeURIComponent(x.LPM_ID).replaceAll("'","%27")}'))">구글 슬라이드로 내보내기</button><button class="btn ghost" onclick="downloadCurrentImage(this)">이미지 저장하기</button></div>`;showModal(x.ProductName,x.ImageURL,info('품번',esc(x.ProductCode))+info('분류',`${esc(x.Category||'')} / ${esc(x.SubCategory||'')}`)+info('컬러',`${esc(x.ColorTone||'')} ${esc(x.ColorHex||'')}`)+info('특징',esc(x.Characteristics))+info('형태',esc(x.PatternForm))+info('용도',esc(x.Applications))+info('추천 경면판',ep.map(v=>`<button class="chip" onclick="openEmbossById(decodeURIComponent('${encodeURIComponent(v.EmbossPlate_ID).replaceAll("'","%27")}'))">${esc(v.PlateName)}</button>`).join(' '))+info('관련 패턴',ps.map(v=>`<button class="chip" onclick="openPatternById(decodeURIComponent('${encodeURIComponent(v.ID).replaceAll("'","%27")}'))">${esc(v.PatternName_KR)}</button>`).join(' ')),actions)}
function openEmboss(x){const ls=db.lpm.filter(v=>split(v.EmbossPlate_IDs).includes(x.EmbossPlate_ID));showModal(x.PlateName,x.ImageURL,info('회사',esc(x.Company))+info('종류',esc(x.Type))+info('광택',esc(x.GlossLevel))+info('추천 패턴 종류',esc(x.RecommendedPatternTypes))+info('특징',esc(x.Characteristics))+info('추천 효산 LPM',ls.map(v=>`<button class="chip" onclick="openLpmById(decodeURIComponent('${encodeURIComponent(v.LPM_ID).replaceAll("'","%27")}'))">${esc(v.ProductName)}</button>`).join(' ')),`<div class="actions"><button class="btn ghost" onclick="downloadCurrentImage(this)">이미지 저장하기</button></div>`)}
function openLpmById(id){const x=db.lpm.find(v=>v.LPM_ID===id);if(x)openLpm(x)}function openEmbossById(id){const x=db.emboss.find(v=>v.EmbossPlate_ID===id);if(x)openEmboss(x)}function openPatternById(id){const x=db.patterns.find(v=>v.ID===id);if(x)openPattern(x)}
function hexRgb(h){h=(h||'').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let n=parseInt(h,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}}function rgbHex(r,g,b){return '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('').toUpperCase()}function hslRgb(h,s,l){s/=100;l/=100;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let r=0,g=0,b=0;if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}return{r:(r+m)*255,g:(g+m)*255,b:(b+m)*255}}
function rgbLab({r,g,b}){let v=[r,g,b].map(x=>{x/=255;return x>.04045?Math.pow((x+.055)/1.055,2.4):x/12.92});let X=(v[0]*.4124+v[1]*.3576+v[2]*.1805)/.95047,Y=(v[0]*.2126+v[1]*.7152+v[2]*.0722),Z=(v[0]*.0193+v[1]*.1192+v[2]*.9505)/1.08883;[X,Y,Z]=[X,Y,Z].map(x=>x>.008856?Math.cbrt(x):7.787*x+16/116);return{L:116*Y-16,a:500*(X-Y),b:200*(Y-Z)}}function dE(a,b){return Math.sqrt((a.L-b.L)**2+(a.a-b.a)**2+(a.b-b.b)**2)}
function drawWheel(){const c=$('#wheel'),ctx=c.getContext('2d'),w=c.width,r=w/2,s=+$('#sat').value,l=+$('#light').value,img=ctx.createImageData(w,w);for(let y=0;y<w;y++)for(let x=0;x<w;x++){const dx=x-r,dy=y-r,d=Math.hypot(dx,dy),i=(y*w+x)*4;if(d<=r){const h=(Math.atan2(dy,dx)*180/Math.PI+360)%360,rgb=hslRgb(h,s*(d/r),l);img.data[i]=rgb.r;img.data[i+1]=rgb.g;img.data[i+2]=rgb.b;img.data[i+3]=255}else img.data[i+3]=0}ctx.putImageData(img,0,0);$('#satV').textContent=s;$('#lightV').textContent=l}
function pick(e){const rect=$('#wheel').getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*300,y=(e.clientY-rect.top)/rect.height*300,dx=x-150,dy=y-150,d=Math.hypot(dx,dy);if(d>150)return;const h=(Math.atan2(dy,dx)*180/Math.PI+360)%360,rgb=hslRgb(h,+$('#sat').value*(d/150),+$('#light').value),hex=rgbHex(rgb.r,rgb.g,rgb.b);state.wheelPoint={h,ratio:d/150};state.selectedHex=hex;$('#picker').style.left=(x/3)+'%';$('#picker').style.top=(y/3)+'%';$('#swatch').style.background=hex;$('#hex').textContent=hex;renderColor()}
function renderColor(){const lab=rgbLab(hexRgb(state.selectedHex)),threshold=CONFIG.COLOR_TOLERANCE_PERCENT;const rows=db.lpm.map(x=>({...x,_d:/^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(x.ColorHex)?dE(lab,rgbLab(hexRgb(x.ColorHex))):999})).filter(x=>x._d<=threshold&&String(x.Active).toLowerCase()!=='false').sort((a,b)=>a._d-b._d);$('#colorHelp').textContent=`${state.selectedHex} 기준 · 유사도 ${CONFIG.COLOR_TOLERANCE_PERCENT}% 범위 · ${rows.length}개`;$('#colorGrid').innerHTML='';rows.forEach(x=>$('#colorGrid').appendChild(card(x,'lpm')))}
function actionStatus(text){const el=$('#actionStatus');if(el)el.textContent=text}
function slidesLink(j){
 if(/^[A-Za-z0-9_-]+$/.test(j.presentationId||''))return 'https://docs.google.com/presentation/d/'+j.presentationId+'/edit';
 const u=new URL(j.url||j.presentationUrl||'');
 if(u.hostname!=='docs.google.com'||!['https:','http:'].includes(u.protocol)||!u.pathname.startsWith('/presentation/'))throw new Error('Slides 링크를 확인할 수 없습니다.');
 u.protocol='https:';return u.href;
}
let exporting=false;
async function exportSlide(id){
 if(exporting)return;if(!CONFIG.API_URL){actionStatus('데이터 연결 주소가 없습니다.');return}
 exporting=true;actionStatus('Google Slides를 만들고 있습니다…');
 const popup=window.open('about:blank','_blank');if(popup)popup.opener=null;
 try{
  const r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'exportToSlides',lpmId:id})});
  if(!r.ok)throw new Error('서버 응답 '+r.status);const j=await r.json();if(!j.ok)throw new Error(j.error||'내보내기에 실패했습니다.');
  const url=slidesLink(j);actionStatus('Google Slides가 생성되었습니다.');const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener';link.textContent=' Google Slides 열기';$('#actionStatus').appendChild(link);if(popup)popup.location.href=url;
 }catch(e){if(popup)popup.close();actionStatus('Slides 내보내기 실패: '+e.message)}finally{exporting=false}
}
async function downloadCurrentImage(button){
 const item={...state.modalImage};if(!/^https?:\/\//i.test(item.url||'')){actionStatus('등록된 이미지가 없습니다. 이미지 URL을 입력해 주세요.');return}
 button.disabled=true;actionStatus('이미지를 저장하고 있습니다…');
 try{
  const r=await fetch(item.url,{signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('이미지 응답 '+r.status);
  const blob=await r.blob();if(!blob.type.startsWith('image/'))throw Error('이미지 파일 주소가 아닙니다.');
  const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/svg+xml':'svg'})[blob.type]||'img';
  const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=(item.name||'HYOSAN').replace(/[\\/:*?"<>|]/g,'_')+'.'+ext;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);actionStatus('이미지 다운로드를 시작했습니다.');
 }catch(e){actionStatus('이미지 서버에서 다운로드를 허용하지 않거나 주소를 읽을 수 없습니다. '+e.message)}finally{button.disabled=false}
}
function buildPrintCatalog(){
 const page=$('.page.active'),menu=$('.nav button.active').textContent,category=page.querySelector('.tabs button.active');
 const title=category?menu+' · '+category.textContent:menu;let rows=[],type='lpm';
 if(page.id==='patterns'){type='pattern';rows=db.patterns.filter(x=>(state.patternCat==='ALL'||x.PrimaryCategory===state.patternCat)&&searchOK(x))}
 else if(page.id==='lpm')rows=db.lpm.filter(x=>(state.lpmCat==='ALL'||x.Category===state.lpmCat)&&searchOK(x)&&String(x.Active).toLowerCase()!=='false');
 else if(page.id==='emboss'){type='emboss';rows=db.emboss.filter(searchOK)}
 else{const lab=rgbLab(hexRgb(state.selectedHex));rows=db.lpm.filter(x=>/^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(x.ColorHex)&&String(x.Active).toLowerCase()!=='false').map(x=>({...x,_d:dE(lab,rgbLab(hexRgb(x.ColorHex)))})).filter(x=>x._d<=CONFIG.COLOR_TOLERANCE_PERCENT).sort((a,b)=>a._d-b._d)}
 const root=$('#printArea');root.replaceChildren();const pages=Math.max(1,Math.ceil(rows.length/8));
 for(let p=0;p<pages;p++){const sheet=document.createElement('section');sheet.className='print-sheet';const heading=document.createElement('h1');heading.className='print-heading';heading.textContent=title;sheet.appendChild(heading);const search=document.createElement('div');search.className='print-search';search.textContent='품번 / 이름 검색: '+($('#search').value.trim()||'전체')+(page.id==='colorist'?' · '+state.selectedHex:'');sheet.appendChild(search);const cards=document.createElement('div');cards.className='print-cards';rows.slice(p*8,p*8+8).forEach(x=>cards.appendChild(card(x,type)));if(!rows.length)cards.textContent='검색 결과가 없습니다.';sheet.appendChild(cards);const footer=document.createElement('p');footer.className='print-footer';footer.textContent='HYOSAN LPM · '+rows.length+'개 · '+(p+1)+' / '+pages;sheet.appendChild(footer);root.appendChild(sheet)}
}
async function printCatalog(){
 buildPrintCatalog();await Promise.all([...$('#printArea').querySelectorAll('img')].map(img=>img.decode().catch(()=>{})));await document.fonts.ready;window.print();
}
window.addEventListener('beforeprint',buildPrintCatalog);

function renderAll(){renderPatterns();renderLpm();renderEmboss();drawWheel();$('#swatch').style.background=state.selectedHex;$('#hex').textContent=state.selectedHex;renderColor()}
$$('.nav button').forEach(b=>b.onclick=()=>{$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.page').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.page).classList.add('active');$('#pageTitle').textContent=b.textContent});$('#search').oninput=()=>{state.pPage=1;state.lPage=1;renderPatterns();renderLpm();renderEmboss()};$('#reload').onclick=syncData;$('#wheel').onclick=pick;['sat','light'].forEach(id=>$('#'+id).oninput=()=>{drawWheel();if(state.wheelPoint){const rgb=hslRgb(state.wheelPoint.h,+$('#sat').value*state.wheelPoint.ratio,+$('#light').value);state.selectedHex=rgbHex(rgb.r,rgb.g,rgb.b);$('#swatch').style.background=state.selectedHex;$('#hex').textContent=state.selectedHex}renderColor()});$('#modal').addEventListener('click',e=>{const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()});
renderAll();syncData();setInterval(syncData,CONFIG.SYNC_MS);
</script>
