.img-wrap{position:relative}.gallery-btn{position:absolute;z-index:3;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:31px;height:31px;padding:0;border:1px solid rgba(255,255,255,.9);border-radius:50%;background:rgba(17,17,17,.8);box-shadow:0 2px 10px rgba(0,0,0,.55);color:#fff;font-family:Arial,sans-serif;font-size:18px;font-weight:400;line-height:31px;cursor:pointer}.gallery-btn:hover,.gallery-btn:focus-visible{background:#111;outline:2px solid #fff}.gallery-btn.prev{left:14px}.gallery-btn.next{right:14px}.gallery-count{position:absolute;z-index:3;left:50%;bottom:12px;transform:translateX(-50%);padding:5px 9px;border-radius:999px;background:rgba(17,17,17,.72);color:#fff;font-size:8pt}.magnifier-preview{position:absolute;z-index:2;display:none;width:180px;height:180px;border:2px solid #fff;border-radius:10px;background-color:#fff;background-repeat:no-repeat;box-shadow:0 8px 28px rgba(0,0,0,.4);pointer-events:none}.magnifier-preview.visible{display:block}@media(max-width:900px),(hover:none){.img-wrap{cursor:default}.magnifier-preview{display:none!important}}

<script>
const CONFIG={API_URL:'https://script.google.com/macros/s/AKfycbz2_7sYLn86R2WomTWsgeydGw9vy99f3EuF7RGVnt-wE_Y1yH_hUtjtgAwEFezXkkAu/exec',SYNC_MS:60000,SYNC_TIMEOUT_MS:30000,ITEMS_PER_PAGE:30,COLOR_TOLERANCE_PERCENT:20};
let db={patterns:[],lpm:[],emboss:[],categories:[],config:{}},state={patternCat:'ALL',lpmCat:'ALL',pPage:1,lPage:1,ePage:1,selectedHex:'#C7A97B',modalImages:[],modalIndex:0,modalTitle:''},syncPromise=null,lastPayloadText='',appStarted=false,syncTimer=null;
const auth={required:false,clientId:'',idToken:'',sessionToken:localStorage.getItem('hyosan-session')||'',user:null};
const $=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],split=v=>String(v||'').split(',').map(x=>x.trim()).filter(Boolean);
const cacheDb=()=>new Promise((resolve,reject)=>{const request=indexedDB.open('hyosan-library',1);request.onupgradeneeded=()=>request.result.createObjectStore('data');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});
async function loadCachedData(){try{const store=(await cacheDb()).transaction('data','readonly').objectStore('data');return await new Promise((resolve,reject)=>{const r=store.get('latest');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}catch(e){return null}}
async function saveCachedData(value){try{const store=(await cacheDb()).transaction('data','readwrite').objectStore('data');store.put(value,'latest')}catch(e){}}
function imageUrl(u){
 const raw=String(u||'').trim(),fallback='https://placehold.co/800x600/e7e2d9/555?text=No+Image';
 if(!/^https?:\/\//i.test(raw))return fallback;
 try{
  const url=new URL(raw);
  if(/(^|\.)drive\.google\.com$/i.test(url.hostname)){
   const match=url.pathname.match(/^\/file\/d\/([^/]+)/),id=(match&&match[1])||url.searchParams.get('id');
   if(id)return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1600';
  }
 }catch(e){}
 return raw;
}
function imageUrls(value){const values=(Array.isArray(value)?value:[value]).flatMap(v=>String(v||'').split(/[\r\n,;|]+/));const urls=[...new Set(values.map(v=>v.trim()).filter(v=>/^https?:\/\//i.test(v)).map(imageUrl))];return urls.length?urls:[imageUrl('')]}
const safeImg=u=>esc(imageUrls(u)[0]);
function setStatus(t,kind=''){const e=$('#syncStatus');e.textContent=t;e.className='status '+kind}
async function apiPost(action,extra={}){
 const body={action,...extra};if(auth.sessionToken)body.sessionToken=auth.sessionToken;else if(auth.idToken)body.idToken=auth.idToken;
 const r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:AbortSignal.timeout(CONFIG.SYNC_TIMEOUT_MS)});
 if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j.ok===false)throw new Error(j.error||'요청에 실패했습니다.');return j;
}
async function syncData(){
 if(!CONFIG.API_URL){setStatus('Apps Script URL 설정 필요','err');return}if(syncPromise)return syncPromise;
 syncPromise=(async()=>{try{
  setStatus('Google Sheets 동기화 중…');let j,payload;
  if(auth.required){j=await apiPost('data');payload=JSON.stringify(j)}else{const r=await fetch(CONFIG.API_URL+'?action=data&ts='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(CONFIG.SYNC_TIMEOUT_MS)});if(!r.ok)throw new Error('HTTP '+r.status);payload=await r.text();j=JSON.parse(payload)}
  if(j.ok===false||!['patterns','lpm','emboss','categories'].every(k=>Array.isArray(j[k])))throw new Error(j.error||'잘못된 데이터 응답');if(payload!==lastPayloadText){db=j;lastPayloadText=payload;renderAll();saveCachedData(j)}setStatus('최신 Google Sheets 반영 · '+new Date().toLocaleTimeString(),'ok')
 }catch(e){setStatus('동기화 실패 · '+e.message,'err')}})().finally(()=>{syncPromise=null});return syncPromise;
}
function searchOK(x){const q=$('#search').value.trim().toLowerCase();return !q||JSON.stringify(x).toLowerCase().includes(q)}
function tabs(el,items,active,cb){el.innerHTML='';items.forEach(x=>{const b=document.createElement('button');b.textContent=x.label;b.className=x.code===active?'active':'';b.onclick=()=>cb(x.code);el.appendChild(b)})}
function cats(menu,fallback){const rows=(db.categories||[]).filter(x=>x.Menu===menu);return rows.length?rows.map(x=>({code:x.Code,label:x.Label})):fallback}
function card(item,type){const d=document.createElement('div');d.className='card';let title='',sub='',image='';if(type==='pattern'){title=item.PatternName_KR||item.PatternName_EN;sub=item.SubCategory;image=item.PreviewImageURL||item.MainImageURL}else if(type==='lpm'){title=item.ProductName;sub=(item.ProductCode||'')+' · '+(item.Category||'');image=item.PreviewImageURL||item.ImageURL}else{title=item.PlateName;sub=(item.Company||'')+' · '+(item.Type||'');image=item.ImageURL}d.innerHTML=`<img src="${safeImg(image)}" loading="lazy" decoding="async"><div class="body"><h2>${esc(title||'-')}</h2><div class="tag">${esc(sub||'')}</div></div>`;d.tabIndex=0;d.setAttribute('role','button');d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();d.click()}};d.onclick=()=>type==='pattern'?openPattern(item):type==='lpm'?openLpm(item):openEmboss(item);return d}
function pageRows(list,p){const max=Math.max(1,Math.ceil(list.length/CONFIG.ITEMS_PER_PAGE));p=Math.max(1,Math.min(p,max));return {rows:list.slice((p-1)*CONFIG.ITEMS_PER_PAGE,p*CONFIG.ITEMS_PER_PAGE),p,max}}
function pager(el,p,max,cb){el.innerHTML='';if(max<=1)return;['‹',...Array.from({length:max},(_,i)=>i+1),'›'].forEach(v=>{const b=document.createElement('button');b.textContent=v;if(v===p)b.className='active';b.onclick=()=>cb(v==='‹'?Math.max(1,p-1):v==='›'?Math.min(max,p+1):v);el.appendChild(b)})}
function renderPatterns(){const cs=cats('PATTERN',[{code:'ALL',label:'전체'},{code:'WOOD',label:'우드'},{code:'MARBLE',label:'대리석'},{code:'STONE',label:'스톤'},{code:'FABRIC',label:'섬유 / 패브릭'},{code:'TILE',label:'타일 / 세라믹'},{code:'CONCRETE',label:'콘크리트 / 미네랄'},{code:'METAL',label:'메탈'},{code:'NATURAL',label:'내추럴 / 오가닉'},{code:'SOLID',label:'솔리드 / 그래픽'}]);tabs($('#patternTabs'),cs,state.patternCat,c=>{state.patternCat=c;state.pPage=1;renderPatterns()});let list=db.patterns.filter(x=>(state.patternCat==='ALL'||x.PrimaryCategory===state.patternCat)&&searchOK(x));const p=pageRows(list,state.pPage);$('#patternGrid').replaceChildren(...p.rows.map(x=>card(x,'pattern')));pager($('#patternPager'),p.p,p.max,n=>{state.pPage=n;renderPatterns()})}
function renderLpm(){const cs=cats('LPM',[{code:'ALL',label:'전체'},{code:'SOLID',label:'솔리드'},{code:'WOOD',label:'우드'},{code:'STONE',label:'스톤'},{code:'FABRIC',label:'패브릭'}]);tabs($('#lpmTabs'),cs,state.lpmCat,c=>{state.lpmCat=c;state.lPage=1;renderLpm()});let list=db.lpm.filter(x=>(state.lpmCat==='ALL'||x.Category===state.lpmCat)&&searchOK(x)&&String(x.Active).toLowerCase()!=='false');const p=pageRows(list,state.lPage);$('#lpmGrid').replaceChildren(...p.rows.map(x=>card(x,'lpm')));pager($('#lpmPager'),p.p,p.max,n=>{state.lPage=n;renderLpm()})}
function renderEmboss(){const p=pageRows(db.emboss.filter(searchOK),state.ePage);$('#embossGrid').replaceChildren(...p.rows.map(x=>card(x,'emboss')));pager($('#embossPager'),p.p,p.max,n=>{state.ePage=n;renderEmboss()})}
